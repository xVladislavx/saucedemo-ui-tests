name: UI Tests
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]


jobs:
  UI-Tests:
    runs-on: ubuntu-latest
    outputs:
      pages_uploaded: ${{ steps.pages_artifact.outcome == 'success' }}
    steps:
      - name: Check out repository code
        uses: actions/checkout@v6
      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - name: Run UI tests
        run: mvn --batch-mode test -Dheadless=true
      - name: Upload Selenide failure artifacts
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: selenide-failure-reports
          path: target/selenide-reports/
          if-no-files-found: warn
      - name: Upload Allure results
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: target/allure-results/
          if-no-files-found: warn
      - name: Install Allure CLI
        if: ${{ always() }}
        run: npm install -g allure-commandline@2.46.1
      - name: Generate Allure HTML report
        if: ${{ always() }}
        run: allure generate target/allure-results --clean -o target/allure-report
      - name: Upload Allure HTML report
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: allure-html-report
          path: target/allure-report/
          if-no-files-found: warn
      - name: Upload GitHub Pages artifact
        id: pages_artifact
        if: ${{ always() && github.event_name == 'push' && github.ref == 'refs/heads/main' && hashFiles('target/allure-report/index.html') != '' }}
        uses: actions/upload-pages-artifact@v4
        with:
          path: target/allure-report/

  deploy:
    needs: UI-Tests
    if: ${{ always() && github.event_name == 'push' && github.ref == 'refs/heads/main' && needs['UI-Tests'].outputs.pages_uploaded == 'true' }}
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy Allure report to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4