name: UI Tests
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  UI-Tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository code
        uses: actions/checkout@v6
      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - name: Run UI tests
        run: mvn --batch-mode test -Dheadless=true
      - name: Upload Selenide failure artifacts
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: selenide-failure-reports
          path: target/selenide-reports/
          if-no-files-found: warn
      - name: Upload Allure results
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: target/allure-results/
          if-no-files-found: warn